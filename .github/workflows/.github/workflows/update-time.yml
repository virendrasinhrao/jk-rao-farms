name: Auto Update Timestamp

on:
  push:
    branches:
      - main  # (or 'master' depending on your branch name)

jobs:
  update-time:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp in HTML file
        run: |
          # Get current date and time in IST
          CURRENT_TIME=$(TZ='Asia/Kolkata' date +'%d/%m/%Y - %H:%M IST')
          
          # Replace with your actual HTML file name if it differs from index.html
          FILENAME="index.html" 
          
          # Automatically replaces the text inside id="auto-timestamp" on every commit
          sed -i "s|<span id=\"auto-timestamp\">[0-9/:\ \-]* IST<\/span>|<span id=\"auto-timestamp\">$CURRENT_TIME<\/span>|g" $FILENAME

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update timestamp [skip ci]"
          file_pattern: "*.html"
