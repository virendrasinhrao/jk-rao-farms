<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J K Rao Farms</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 10px; margin:0; }
    .nav { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; }
    .nav button { flex: 1; padding: 12px; cursor: pointer; border: none; background: #bdc3c7; border-radius: 4px; font-weight: bold; }
    .nav button.active { background: #27ae60; color: white; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; font-size:14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 12px; background: #2980b9; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight:bold;}
    .readonly-bg { background-color: #e9ecef; }
    .section { display: none; }
    .section.active { display: block; }
    .flex-row { display: flex; gap: 10px; }
    .flex-row > div { flex: 1; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;}
    .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 400px; border-radius: 8px; }
  </style>
</head>
<body>

<div class="card">
  <div class="nav">
    <button id="tabSales" class="active" onclick="switchTab('Sales')">વેચાણ</button>
    <button id="tabMed" onclick="switchTab('Med')">દવા</button>
    <button id="tabFert" onclick="switchTab('Fert')">ખાતર</button>
    <button id="tabTrac" onclick="switchTab('Trac')">ટ્રેક્ટર</button>
  </div>

  <!-- 1. SALES FORM -->
  <div id="formSales" class="section active">
    <h3 style="text-align:center; color:#27ae60;">🌱 વેચાણ (Sales)</h3>
    <form onsubmit="submitSales(event)">
      <div class="flex-row"><div class="form-group"><label>તારીખ:</label><input type="date" id="sDate" required></div><div class="form-group"><label>બિલ નં:</label><input type="text" id="sBill" required></div></div>
      <div class="form-group"><label>ભાગીદાર:</label><select id="sBhagiya" class="bhagiyaList" required onchange="checkBhagiyaNew(this)"></select></div>
      <div class="form-group"><label>વેપારી:</label><select id="sVepari" class="vepariList" required onchange="checkVepariNew(this)"></select></div>
      <!-- અહી onchange માં checkCropNew(this) ઉમેર્યું છે -->
      <div class="form-group"><label>પાક:</label><select id="sPak" class="pakList" required onchange="checkCropNew(this); calcSales();"></select></div>
      <div class="flex-row"><div class="form-group"><label>પાઉચ/નંગ:</label><input type="number" id="sPauch" value="0"></div><div class="form-group"><label>વજન (કિલો):</label><input type="number" id="sWeight" step="0.01" oninput="calcSales()" required></div></div>
      <div class="flex-row"><div class="form-group"><label>૧ મણનો ભાવ:</label><input type="number" id="sBhav20" step="0.01" oninput="calcSales()" required></div><div class="form-group"><label>૧ કિલોનો ભાવ:</label><input type="text" id="sBhav1" class="readonly-bg" readonly></div></div>
      <div class="form-group"><label>કુલ રકમ (₹):</label><input type="text" id="sTotal" class="readonly-bg" readonly></div>
      <div class="flex-row"><div class="form-group"><label>ખેડૂ હિસ્સો (%):</label><input type="text" id="sKShare" class="readonly-bg" readonly></div><div class="form-group"><label>ખેડૂ રકમ (₹):</label><input type="text" id="sKRakam" class="readonly-bg" readonly></div></div>
      <div class="form-group"><label>સ્થિતિ:</label><select id="sStatus"><option>રોકડા / જમા</option><option>બાકી</option></select></div>
      <div class="flex-row"><div class="form-group"><label>કોણે લીધા?</label><input type="text" id="sHastak" required></div><div class="form-group"><label>ભાગિયાએ લીધા?</label><select id="sBLidha"><option>No</option><option>Yes</option></select></div></div>
      <button type="submit" id="btnSales" class="btn-submit">સેવ કરો</button>
    </form>
  </div>

  <!-- 2. MEDICINE FORM -->
  <div id="formMed" class="section">
    <h3 style="text-align:center; color:#2980b9;">🧪 દવા ખર્ચ (Medicine)</h3>
    <form onsubmit="submitMed(event)">
      <div class="flex-row"><div class="form-group"><label>તારીખ:</label><input type="date" id="mDate" required></div><div class="form-group"><label>બિલ નં:</label><input type="text" id="mBill" required></div></div>
      <div class="form-group"><label>ભાગીદાર:</label><select id="mBhagiya" class="bhagiyaList" required onchange="checkBhagiyaNew(this)"></select></div>
      <div class="form-group"><label>વેપારી:</label><input type="text" id="mVepari" required></div>
      <!-- અહી onchange માં checkCropNew(this) ઉમેર્યું છે -->
      <div class="form-group"><label>પાક:</label><select id="mPak" class="pakList" required onchange="checkCropNew(this); calcMed();"></select></div>
      <div class="flex-row"><div class="form-group"><label>દવાનું નામ:</label><input type="text" id="mDava" required></div><div class="form-group"><label>પ્રકાર:</label><select id="mType" required onchange="calcMed()"><option value="જંતુનાશક">જંતુનાશક</option><option value="નિંદામણ">નિંદામણ (ઘાસ)</option><option value="ફૂગનાશક">ફૂગનાશક</option></select></div></div>
      <div class="flex-row"><div class="form-group"><label>પેકિંગ:</label><input type="text" id="mPack" placeholder="દા.ત. 250" onblur="formatPacking(this)" required></div><div class="form-group"><label>ભાવ (પ્રતિ પેકિંગ):</label><input type="number" id="mBhav" oninput="calcMed()" required></div></div>
      <div class="form-group"><label>કુલ રકમ (₹):</label><input type="number" id="mTotal" oninput="calcMed()" required></div>
      <div class="flex-row"><div class="form-group"><label>ખેડૂ હિસ્સો (%):</label><input type="text" id="mKShare" class="readonly-bg" readonly></div><div class="form-group"><label>ખેડૂ રકમ (₹):</label><input type="text" id="mKRakam" class="readonly-bg" readonly></div></div>
      <div class="flex-row"><div class="form-group"><label>સ્થિતિ:</label><select id="mStatus"><option>રોકડા</option><option>બાકી</option></select></div><div class="form-group"><label>કોણે આપ્યા?</label><input type="text" id="mHastak" required></div></div>
      <button type="submit" id="btnMed" class="btn-submit">સેવ કરો</button>
    </form>
  </div>

  <!-- 3. FERTILIZER FORM -->
  <div id="formFert" class="section">
    <h3 style="text-align:center; color:#d35400;">🌾 ખાતર ખર્ચ (Fertilizer)</h3>
    <form onsubmit="submitFert(event)">
      <div class="flex-row"><div class="form-group"><label>તારીખ:</label><input type="date" id="fDate" required></div><div class="form-group"><label>બિલ નં:</label><input type="text" id="fBill" required></div></div>
      <div class="form-group"><label>ભાગીદાર:</label><select id="fBhagiya" class="bhagiyaList" required onchange="checkBhagiyaNew(this)"></select></div>
      <div class="form-group"><label>વેપારી:</label><input type="text" id="fVepari" required></div>
      <!-- અહી onchange માં checkCropNew(this) ઉમેર્યું છે -->
      <div class="form-group"><label>પાક:</label><select id="fPak" class="pakList" required onchange="checkCropNew(this); calcFert();"></select></div>
      <div class="flex-row"><div class="form-group"><label>ખાતરનું નામ:</label><input type="text" id="fKhatar" required></div><div class="form-group"><label>થેલી / વજન:</label><input type="text" id="fQty" onblur="formatPacking(this)" required></div></div>
      <div class="flex-row"><div class="form-group"><label>ભાવ:</label><input type="number" id="fBhav" oninput="calcFert()" required></div><div class="form-group"><label>કુલ રકમ (₹):</label><input type="number" id="fTotal" oninput="calcFert()" required></div></div>
      <div class="flex-row"><div class="form-group"><label>ખેડૂ હિસ્સો (%):</label><input type="text" id="fKShare" class="readonly-bg" readonly></div><div class="form-group"><label>ખેડૂ રકમ (₹):</label><input type="text" id="fKRakam" class="readonly-bg" readonly></div></div>
      <div class="form-group"><label>સ્થિતિ:</label><select id="fStatus"><option>રોકડા</option><option>બાકી</option></select></div>
      <div class="form-group"><label>કોણે આપ્યા?</label><input type="text" id="fHastak" required></div>
      <button type="submit" id="btnFert" class="btn-submit">સેવ કરો</button>
    </form>
  </div>

  <!-- 4. TRACTOR FORM -->
  <div id="formTrac" class="section">
    <h3 style="text-align:center; color:#8e44ad;">🚜 ટ્રેક્ટર ખર્ચ (Tractor)</h3>
    <form onsubmit="submitTrac(event)">
      <div class="flex-row"><div class="form-group"><label>તારીખ:</label><input type="date" id="tDate" required></div><div class="form-group"><label>વાઉચર/બિલ:</label><input type="text" id="tBill"></div></div>
      <div class="form-group"><label>ભાગીદાર:</label><select id="tBhagiya" class="bhagiyaList" required onchange="checkBhagiyaNew(this)"></select></div>
      <div class="form-group"><label>ડ્રાઈવર/માલિક:</label><input type="text" id="tDriver" required></div>
      <div class="flex-row">
        <!-- અહી onchange માં checkCropNew(this) ઉમેર્યું છે -->
        <div class="form-group"><label>પાક:</label><select id="tPak" class="pakList" required onchange="checkCropNew(this); calcTrac();"></select></div>
        <div class="form-group"><label>કામ:</label><select id="tWork" required onchange="calcTrac()"><option>હળામણ</option><option>દાંતી</option><option>રોટાવેટર</option><option>પાળા</option><option>નિકો</option><option>દવા છાંટવી</option><option>અન્ય</option></select></div>
      </div>
      <div class="flex-row"><div class="form-group"><label>કુલ કલાક:</label><input type="number" id="tHrs" step="0.5" oninput="calcTrac()" required></div><div class="form-group"><label>ભાવ (કલાકના):</label><input type="number" id="tRate" oninput="calcTrac()" required></div></div>
      <div class="form-group"><label>કુલ ભાડું (₹):</label><input type="text" id="tTotal" class="readonly-bg" readonly></div>
      <div class="flex-row"><div class="form-group"><label>ખેડૂ હિસ્સો (%):</label><input type="text" id="tKShare" class="readonly-bg" readonly></div><div class="form-group"><label>ખેડૂ રકમ (₹):</label><input type="text" id="tKRakam" class="readonly-bg" readonly></div></div>
      <div class="form-group"><label>સ્થિતિ:</label><select id="tStatus"><option>રોકડા</option><option>બાકી</option></select></div>
      <div class="form-group"><label>કોણે આપ્યા?</label><input type="text" id="tHastak" required></div>
      <button type="submit" id="btnTrac" class="btn-submit">સેવ કરો</button>
    </form>
  </div>
</div>

<!-- Pop-ups -->
<div id="modalBhagiya" class="modal"><div class="modal-content"><h3>➕ નવો ભાગીદાર</h3><input type="text" id="nbName" placeholder="નામ" class="form-group"><input type="number" id="nbPhone" placeholder="મોબાઈલ" class="form-group"><input type="text" id="nbAdd" placeholder="ગામ" class="form-group"><button type="button" class="btn-submit" onclick="saveB()">સેવ</button><button type="button" onclick="document.getElementById('modalBhagiya').style.display='none'" style="margin-top:10px; width:100%; padding:10px;">કેન્સલ</button></div></div>

<div id="modalVepari" class="modal"><div class="modal-content"><h3>➕ નવો વેપારી</h3><input type="text" id="nvName" placeholder="નામ" class="form-group"><input type="number" id="nvPhone" placeholder="મોબાઈલ" class="form-group"><input type="text" id="nvCity" placeholder="ગામ" class="form-group"><button type="button" class="btn-submit" onclick="saveV()">સેવ</button><button type="button" onclick="document.getElementById('modalVepari').style.display='none'" style="margin-top:10px; width:100%; padding:10px;">કેન્સલ</button></div></div>

<!-- નવો પાક ઉમેરવા માટેનું પોપ-અપ -->
<div id="modalCrop" class="modal"><div class="modal-content"><h3>➕ નવો પાક ઉમેરો</h3><input type="text" id="ncName" placeholder="પાકનું નામ (દા.ત. જીરું)" class="form-group"><input type="number" id="ncShare" placeholder="ખેડૂ હિસ્સો (%) દા.ત. 50" class="form-group"><button type="button" class="btn-submit" onclick="saveC()">સેવ</button><button type="button" onclick="document.getElementById('modalCrop').style.display='none'" style="margin-top:10px; width:100%; padding:10px;">કેન્સલ</button></div></div>

<script>
  // 🔴 અહીં તમારી Apps Script ની નવી ડેપ્લોય લિંક મૂકો 🔴
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxowJ9vR9ZUmeZu3BtDPno2IcRxKIUuv9yPMB3CFT7wUhWDOwYnJjbjWFmLJYPNlQ7ROQ/exec"; 
  
  let appData = {};

  window.onload = function() {
    document.getElementById('sDate').valueAsDate = document.getElementById('mDate').valueAsDate = document.getElementById('fDate').valueAsDate = document.getElementById('tDate').valueAsDate = new Date();
    fetch(SCRIPT_URL).then(res => res.json()).then(res => {
      appData = res.data;
      populateData();
    });
  };

  function switchTab(tab) {
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
    document.getElementById('form' + tab).classList.add('active');
    document.getElementById('tab' + tab).classList.add('active');
  }

  function populateData() {
    if(!appData.Bhagiya_Master) return;
    
    // ભાગીદાર ડ્રોપડાઉન સેટઅપ
    let bhagiyas = appData.Bhagiya_Master.map(r => r["નામ"]).filter(String);
    document.querySelectorAll('.bhagiyaList').forEach(sel => { 
      sel.innerHTML = '<option value="">-- પસંદ કરો --</option><option value="NEW">➕ નવો ઉમેરો</option>';
      bhagiyas.forEach(b => sel.add(new Option(b, b))); 
    });
    
    // વેપારી ડ્રોપડાઉન સેટઅપ
    let veparis = appData.Merchant_Master.filter(r => r["પ્રકાર"] === "Vegitable").map(r => r["વેપારીનું_નામ"] || r["વેપારીનું નામ"]);
    document.querySelectorAll('.vepariList').forEach(sel => {
      sel.innerHTML = '<option value="">-- પસંદ કરો --</option><option value="NEW">➕ નવો ઉમેરો</option>';
      veparis.forEach(v => sel.add(new Option(v, v)));
    });

    // પાક ડ્રોપડાઉન સેટઅપ (અહીં NEW ઓપ્શન ઉમેર્યું છે)
    let crops = appData.Crop_Master.map(r => r["પાકનું નામ"]).filter(String);
    document.querySelectorAll('.pakList').forEach(sel => { 
      sel.innerHTML = '<option value="">-- પસંદ કરો --</option><option value="NEW">➕ નવો પાક ઉમેરો</option>';
      crops.forEach(c => sel.add(new Option(c, c))); 
    });
  }

  // પોપ-અપ ખોલવાના ફંક્શન
  function checkBhagiyaNew(sel) { 
    if(sel.value === "NEW") { document.getElementById("modalBhagiya").style.display = "block"; sel.value = ""; } 
  }
  function checkVepariNew(sel) { 
    if(sel.value === "NEW") { document.getElementById("modalVepari").style.display = "block"; sel.value = ""; } 
  }
  // નવો પાક પોપ-અપ ખોલવાનું ફંક્શન
  function checkCropNew(sel) { 
    if(sel.value === "NEW") { document.getElementById("modalCrop").style.display = "block"; sel.value = ""; } 
  }

  // પેકિંગ લોજિક
  function formatPacking(input) {
    let val = parseFloat(input.value);
    if(isNaN(val)) return;
    if(val > 0 && val <= 9) input.value = val + " લિટર/કિલો";
    else if(val >= 10) input.value = val + " ગ્રામ/મિલી";
  }

      function getCropShare(cropName) {
    if (!appData.Crop_Master) return 0;
    
    let crop = appData.Crop_Master.find(c => c["પાકનું નામ"] == cropName);
    if (!crop) {
      alert("ભૂલ: આ નામનો પાક Crop_Master માં મળ્યો નથી: " + cropName);
      return 0;
    }
    
    // આનાથી ખબર પડી જશે કે શીટમાંથી કયા હેડિંગમાં શું ડેટા આવે છે
    console.log("Found Crop Row:", crop);
    
    let share = crop["હિસ્સો"] || crop["ખેડૂ હિસ્સો"] || crop["ભાગ"] || crop["ટકા"] || crop["Share"] || crop["ખેડૂત હિસ્સો"] || 0;
    let parsedShare = parseFloat(share.toString().replace(/[^0-9.]/g, '')) || 0;
    
    console.log("Extracted Share:", parsedShare);
    return parsedShare;
  }



  // ગણતરીઓ
  function calcSales() {
    let w = parseFloat(document.getElementById("sWeight").value)||0, b20 = parseFloat(document.getElementById("sBhav20").value)||0;
    document.getElementById("sBhav1").value = (b20/20).toFixed(2); document.getElementById("sTotal").value = (w*(b20/20)).toFixed(2);
    let s = getCropShare(document.getElementById("sPak").value); document.getElementById("sKShare").value = s;
    document.getElementById("sKRakam").value = ((w*(b20/20)) * (s/100)).toFixed(2);
  }

  function calcMed() {
    let t = parseFloat(document.getElementById("mTotal").value)||0;
    let type = document.getElementById("mType").value;
    let s = getCropShare(document.getElementById("mPak").value);
    if(type === "નિંદામણ") s = 100; // નિંદામણનો 100% ખર્ચ
    document.getElementById("mKShare").value = s; document.getElementById("mKRakam").value = (t * (s/100)).toFixed(2);
  }

  function calcFert() {
    let t = parseFloat(document.getElementById("fTotal").value)||0;
    let s = getCropShare(document.getElementById("fPak").value);
    document.getElementById("fKShare").value = s; document.getElementById("fKRakam").value = (t * (s/100)).toFixed(2);
  }

  function calcTrac() {
    let h = parseFloat(document.getElementById("tHrs").value)||0, r = parseFloat(document.getElementById("tRate").value)||0, t = h*r;
    document.getElementById("tTotal").value = t.toFixed(2);
    let w = document.getElementById("tWork").value, s = getCropShare(document.getElementById("tPak").value);
    let finalS = s;
    if(s == 20) finalS = 0; 
    else if(s == 50 && (w=="પાળા" || w=="નિકો" || w=="હળામણ")) finalS = 100; 
    document.getElementById("tKShare").value = finalS; document.getElementById("tKRakam").value = (t * (finalS/100)).toFixed(2);
  }

  function v(id) { return document.getElementById(id).value; }

  // બેલેન્સ ચેક (ઉપાડ લેજરમાંથી)
  function getBalance(bhagiya, type) {
    let bal = 0;
    if(appData.Upad_Ledger) {
      appData.Upad_Ledger.forEach(row => {
        if(row["ભાગીદારનું નામ"] == bhagiya && row["એન્ટ્રી પ્રકાર"] == type) {
          bal += parseFloat(row["ઉપાડ (Debit)"] || 0);
          bal -= parseFloat(row["જમા (Credit)"] || 0);
        }
      });
    }
    return bal;
  }

  function getYear(dateString) {
    let d = new Date(dateString), m = d.getMonth() + 1, y = d.getFullYear();
    return (m >= 5) ? (y + "-" + (y + 1).toString().slice(-2)) : ((y - 1) + "-" + y.toString().slice(-2));
  }

  // ફોર્મ સબમિટ ફંક્શન
  function submitSales(e) { 
    e.preventDefault(); 
    document.getElementById("btnSales").innerText = "સેવ થઈ રહ્યું છે...";
    let row = [ getYear(v("sDate")), "SL-"+Date.now(), v("sDate"), v("sBill"), v("sBhagiya"), v("sVepari"), v("sPak"), v("sPauch"), v("sWeight"), v("sBhav20"), v("sBhav1"), v("sTotal"), v("sKShare"), v("sKRakam"), v("sStatus"), v("sHastak"), v("sBLidha"), "" ];
    saveData("saveSales", row); 
  }

  function submitMed(e) { 
    e.preventDefault(); 
    let bhagiya = v("mBhagiya"), bal = getBalance(bhagiya, "દવા ખરીદી માટે"), amt = v("mTotal");
    let ledgerRow = null;
    if(bal > 0 && confirm(`આ ભાગીદારનું 'દવા ખરીદી' નું બેલેન્સ ₹${bal} છે.\nશું આ બિલ (₹${amt}) ઉપાડમાં જમા લેવું છે?`)) {
      ledgerRow = [ getYear(v("mDate")), "UP-"+Date.now(), v("mDate"), bhagiya, "દવા બીલ જમા", "માલિક", 0, amt, v("mBill"), v("mBill") ];
    }
    document.getElementById("btnMed").innerText = "સેવ થઈ રહ્યું છે...";
    let row = [ getYear(v("mDate")), "ME-"+Date.now(), v("mDate"), v("mBill"), bhagiya, v("mVepari"), v("mPak"), v("mDava"), v("mType"), v("mPack"), v("mBhav"), amt, v("mKShare"), v("mKRakam"), v("mStatus"), v("mHastak"), "" ];
    saveData("saveMedicine", row, ledgerRow);
  }

  function submitFert(e) {

      ledgerRow = [ getYear(v("fDate")), "UP-"+Date.now(), v("fDate"), bhagiya, "ખાતર બીલ જમા", "માલિક", 0, amt, v("fBill"), v("fBill") ];
    }
    document.getElementById("btnFert").innerText = "સેવ થઈ રહ્યું છે...";

  function submitTrac(e) { 
    e.preventDefault(); 
    let bhagiya = v("tBhagiya"), bal = getBalance(bhagiya, "એડવાન્સ પેટે લીધા"), amt = v("tTotal");
    let jamaUpad = "No", ledgerRow = null;
    if(bal > 0 && confirm(`આ ભાગીદારનું 'એડવાન્સ' બેલેન્સ ₹${bal} છે.\nશું આ ટ્રેક્ટર બિલ (₹${amt}) ઉપાડમાં જમા લેવું છે?`)) {
      jamaUpad = "Yes";
      ledgerRow = [ getYear(v("tDate")), "UP-"+Date.now(), v("tDate"), bhagiya, "ટ્રેક્ટર બીલ જમા", "માલિક", 0, amt, v("tBill"), v("tBill") ];
    }
    document.getElementById("btnTrac").innerText = "સેવ થઈ રહ્યું છે...";
    let row = [ getYear(v("tDate")), "TE-"+Date.now(), v("tDate"), v("tBill"), bhagiya, v("tDriver"), v("tPak"), v("tWork"), v("tHrs"), v("tRate"), amt, v("tKShare"), v("tKRakam"), v("tStatus"), v("tHastak"), jamaUpad ];

  }

  // પોપ-અપ સેવ ફંક્શન્સ
  function saveB() {
    let row = [ getYear(v("sDate")), v("nbName"), v("nbPhone"), v("nbAdd") ];
    saveData("saveBhagiya", row); document.getElementById("modalBhagiya").style.display = "none";
  }
  function saveV() {
    let row = [ v("nvName"), v("nvPhone"), v("nvCity"), "Vegitable" ];
    saveData("saveVepari", row); document.getElementById("modalVepari").style.display = "none";
  }
  // નવો પાક સેવ કરવાનું ફંક્શન
  function saveC() {
    let name = v("ncName"), share = v("ncShare");
    if(name == "") return alert("પાકનું નામ જરૂરી છે!");
    let row = [ name, share + "%" ];
    saveData("saveCrop", row); document.getElementById("modalCrop").style.display = "none";
  }

  function saveData(action, rowValues, ledgerRow = null) {
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: action, rowValues: rowValues, ledgerRow: ledgerRow })
    }).then(res => res.json()).then(res => {
      alert("સફળતાપૂર્વક સેવ થઈ ગયું!");
      location.reload();
    }).catch(err => {
      alert("ભૂલ આવી: " + err);
    });
  }
</script>
